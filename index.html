<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cave Arena - FPS Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body { 
        overflow: hidden; 
        background: #000; 
      }
      canvas { 
        display: block; 
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "./three.js-master/build/three.module.js",
          "three/addons/": "./three.js-master/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import { Game } from './src/Game.js';

      // Initialize the game
      async function main() {
        try {
          const game = new Game();
          await game.init();
          game.start();
        } catch (error) {
          console.error('Error initializing game:', error);
        }
      }

      main();
    </script>
  </body>
</html>
